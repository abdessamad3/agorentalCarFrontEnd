<svg viewBox="0 0 200 416"
     class="vm-svg"
     [class.vm-interactive]="mode === 'interactive'"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Direction labels -->
  <text class="vm-dir-lbl" x="100" y="7" text-anchor="middle">{{ t('svgFront') }}</text>
  <text class="vm-dir-lbl" x="100" y="414" text-anchor="middle">{{ t('svgRear') }}</text>
  <text class="vm-dir-lbl" x="5" y="200" text-anchor="middle" transform="rotate(-90,5,200)">{{ t('svgLeft') }}</text>
  <text class="vm-dir-lbl" x="195" y="200" text-anchor="middle" transform="rotate(90,195,200)">{{ t('svgRight') }}</text>

  <!-- Car body background -->
  <rect x="38" y="36" width="124" height="340" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- ── Front Bumper ── -->
  <rect x="54" y="10" width="92" height="28" rx="8" class="vm-zone"
    [attr.fill]="isDamaged('front_bumper') ? '#fca5a5' : '#dde6f0'"
    [attr.stroke]="isDamaged('front_bumper') ? '#ef4444' : '#94a3b8'"
    stroke-width="1.5"
    (click)="handleClick('front_bumper')">
    <title>{{ t('zoneFrontBumper') }}</title>
  </rect>
  <text class="vm-zone-lbl" x="100" y="28" text-anchor="middle" font-size="7">{{ t('zoneFrontBumper') }}</text>

  <!-- ── Hood ── -->
  <rect x="38" y="36" width="124" height="80" rx="0" class="vm-zone"
    [attr.fill]="isDamaged('hood') ? '#fca5a5' : '#e8edf3'"
    [attr.stroke]="isDamaged('hood') ? '#ef4444' : '#94a3b8'"
    stroke-width="1"
    (click)="handleClick('hood')">
    <title>{{ t('zoneHood') }}</title>
  </rect>
  <text class="vm-zone-lbl" x="100" y="80" text-anchor="middle" font-size="8">{{ t('zoneHood') }}</text>

  <!-- ── Windshield ── -->
  <rect x="52" y="116" width="96" height="38" rx="3" class="vm-zone"
    [attr.fill]="isDamaged('windshield') ? '#fca5a5' : '#bfdbfe'"
    [attr.stroke]="isDamaged('windshield') ? '#ef4444' : '#93c5fd'"

    (click)="handleClick('windshield')">

  <text class="vm-zone-lbl" x="100" y="139" text-anchor="middle" font-size="7">{{ t('zoneWindshield') }}</text>

  <!-- ── Roof ── -->
  <rect x="46" y="154" width="108" height="94" rx="4" class="vm-zone"
    [attr.fill]="isDamaged('roof') ? '#fca5a5' : '#dde6f0'"

    stroke-width="1"
    (click)="handleClick('roof')">
