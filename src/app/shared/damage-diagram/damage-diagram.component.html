<div class="diagram-wrap" style="position:relative; display:inline-block">
  <svg viewBox="0 0 400 220" width="400" height="220" style="display:block">

    <!-- Car body -->
    <rect x="80" y="20" width="240" height="180" rx="20" ry="20"
          fill="#e8e8e8" stroke="#555" stroke-width="2"/>

    <!-- Front bumper -->
    <rect x="90" y="15" width="220" height="12"
          fill="#ccc" stroke="#555" stroke-width="1.5" rx="4"/>

    <!-- Rear bumper -->
    <rect x="90" y="193" width="220" height="12"
          fill="#ccc" stroke="#555" stroke-width="1.5" rx="4"/>

    <!-- Windshield (front) -->
    <rect x="110" y="40" width="180" height="45"
          fill="#c8e0f4" stroke="#555" stroke-width="1" rx="6"/>

    <!-- Rear window -->
    <rect x="110" y="135" width="180" height="45"
          fill="#c8e0f4" stroke="#555" stroke-width="1" rx="6"/>

    <!-- Roof (center) -->
    <rect x="105" y="88" width="190" height="44"
          fill="#d0d0d0" stroke="#aaa" stroke-width="1"/>

    <!-- Door dividers -->
    <line x1="80" y1="88" x2="320" y2="88"
          stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="80" y1="132" x2="320" y2="132"
          stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>

    <!-- Left wheels -->
    <ellipse cx="72" cy="70"  rx="14" ry="20" fill="#444" stroke="#222" stroke-width="1.5"/>
    <ellipse cx="72" cy="150" rx="14" ry="20" fill="#444" stroke="#222" stroke-width="1.5"/>

    <!-- Right wheels -->
    <ellipse cx="328" cy="70"  rx="14" ry="20" fill="#444" stroke="#222" stroke-width="1.5"/>
    <ellipse cx="328" cy="150" rx="14" ry="20" fill="#444" stroke="#222" stroke-width="1.5"/>

    <!-- Clickable zone overlays -->
    <rect *ngIf="!readonly" x="90"  y="15" width="220" height="40" fill="transparent" style="cursor:pointer" (click)="onZoneClick('front', $event)">
      <title>Avant</title>
    </rect>
    <rect *ngIf="!readonly" x="90"  y="165" width="220" height="40" fill="transparent" style="cursor:pointer" (click)="onZoneClick('rear', $event)">
      <title>Arrière</title>
    </rect>
    <rect *ngIf="!readonly" x="58"  y="55" width="30" height="110" fill="transparent" style="cursor:pointer" (click)="onZoneClick('left', $event)">
      <title>Gauche</title>
    </rect>
    <rect *ngIf="!readonly" x="312" y="55" width="30" height="110" fill="transparent" style="cursor:pointer" (click)="onZoneClick('right', $event)">
      <title>Droite</title>
    </rect>
    <rect *ngIf="!readonly" x="110" y="40" width="180" height="45" fill="transparent" style="cursor:pointer" (click)="onZoneClick('windshield', $event)">
      <title>Pare-brise</title>
    </rect>
    <rect *ngIf="!readonly" x="105" y="88" width="190" height="44" fill="transparent" style="cursor:pointer" (click)="onZoneClick('roof', $event)">
      <title>Toit</title>
    </rect>

    <!-- Damage markers -->
    <ng-container *ngFor="let d of damages">
      <circle
        [attr.cx]="zoneCenter(d.zone).cx"
        [attr.cy]="zoneCenter(d.zone).cy"
        r="8" fill="#ef4444" opacity="0.9"/>
      <text
        [attr.x]="zoneCenter(d.zone).cx"
        [attr.y]="zoneCenter(d.zone).cy + 4"
        text-anchor="middle" font-size="8" fill="white" font-weight="bold">!</text>
      <title>{{ d.note }}</title>
    </ng-container>

    <!-- Zone labels -->
    <text x="200" y="12"  text-anchor="middle" font-size="7" fill="#777">Avant</text>
    <text x="200" y="218" text-anchor="middle" font-size="7" fill="#777">Arrière</text>
    <text x="18"  y="114" text-anchor="middle" font-size="7" fill="#777" transform="rotate(-90, 18, 114)">Gauche</text>
    <text x="382" y="114" text-anchor="middle" font-size="7" fill="#777" transform="rotate(90, 382, 114)">Droite</text>
  </svg>

  <!-- Popup for damage note -->
  <div *ngIf="showPopup" class="damage-popup"
       [style.left.px]="popupX" [style.top.px]="popupY">
    <div class="popup-title">Note de dommage — {{ zoneLabel(pendingZone!) }}</div>
    <input type="text" [(ngModel)]="pendingNote"
           placeholder="Décrire le dommage..."
           class="popup-input"
           (keydown.enter)="confirmDamage()"
           (keydown.escape)="cancelDamage()" />
    <div class="popup-actions">
      <button type="button" (click)="cancelDamage()">Annuler</button>
      <button type="button" (click)="confirmDamage()" [disabled]="!pendingNote.trim()">Ajouter</button>
    </div>
  </div>
</div>

<!-- Damage list -->
<div *ngIf="damages.length > 0" class="damage-list">
  <div *ngFor="let d of damages; let i = index" class="damage-item">
    <span class="damage-zone">{{ zoneLabel(d.zone) }}</span>
    <span class="damage-note">{{ d.note }}</span>
    <button *ngIf="!readonly" type="button" class="damage-remove" (click)="removeDamage(i)">×</button>
  </div>
</div>
