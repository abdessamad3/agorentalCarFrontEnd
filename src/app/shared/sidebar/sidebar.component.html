<div class="sidebar" [class.open]="isSidebarOpen" [class.rtl]="dir === 'rtl'">

  <!-- Logo -->
  <div class="sidebar-header">
    <div class="logo-icon">🚙</div>
    <div class="logo-text">{{ getLabel('logo') }}</div>
  </div>

  <!-- Language Switcher -->
  <div class="lang-switcher">
    <button [class.active]="currentLang === 'en'" (click)="changeLanguage('en')">EN</button> |
    <button [class.active]="currentLang === 'fr'" (click)="changeLanguage('fr')">FR</button> |
    <button [class.active]="currentLang === 'ar'" (click)="changeLanguage('ar')">AR</button>
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">
    <ng-container *ngFor="let group of menuGroups">
      <div *ngIf="group.labelKey" class="nav-group-label">{{ getLabel(group.labelKey) }}</div>
      <a
        *ngFor="let item of group.items"
        [routerLink]="item.link"
        routerLinkActive="active-link"
        (click)="onNavClick()"
        class="nav-item"
      >
        <span class="nav-icon">{{ item.icon }}</span>
        <span class="nav-label">{{ getLabel(item.key) }}</span>
      </a>
    </ng-container>
  </nav>

  <!-- Footer / Logout -->
  <div class="sidebar-footer">
    <button class="logout-btn" (click)="onLogout()">
      <span class="logout-icon">🚪</span>
      <span>{{ getLabel('logout') }}</span>
    </button>
  </div>
</div>
