<div class="login-container">
  <div class="card">
    <h2>{{ 'loginTitle' | translate }}</h2>

    <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
    <div *ngIf="successMessage" class="success-message">{{ successMessage }}</div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">{{ 'emailLabel' | translate }}</label>
        <input id="email" type="email" formControlName="email"
          [placeholder]="'emailLabel' | translate" required />
        <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="error-text">
          {{ 'invalidEmail' | translate }}
        </div>
      </div>

      <div class="form-group">
        <label for="password">{{ 'passwordLabel' | translate }}</label>
        <input id="password" type="password" formControlName="password"
          [placeholder]="'passwordLabel' | translate" required />
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error-text">
          {{ 'passwordMin' | translate }}
        </div>
      </div>

      <button type="submit" [disabled]="isLoading">
        {{ (isLoading ? 'saving' : 'loginBtn') | translate }}
      </button>
    </form>

    <div class="footer-link">
      {{ 'noAccount' | translate }}
      <a routerLink="/register">{{ 'registerLink' | translate }}</a>
    </div>
  </div>
</div>
