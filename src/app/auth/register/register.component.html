<div class="register-container">
  <div class="card">
    <h2>{{ 'registerTitle' | translate }}</h2>

    <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
    <div *ngIf="successMessage" class="success-message">{{ successMessage }}</div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">{{ 'emailLabel' | translate }}</label>
        <input id="email" type="email" formControlName="email"
          [placeholder]="'emailLabel' | translate">
        <div *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched" class="error-text">
          {{ 'invalidEmail' | translate }}
        </div>
      </div>

      <div class="form-group">
        <label for="password">{{ 'passwordLabel' | translate }}</label>
        <input id="password" type="password" formControlName="password"
          [placeholder]="'passwordMin' | translate">
        <div *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched" class="error-text">
          {{ 'passwordMin' | translate }}
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">{{ 'confirmPasswordLabel' | translate }}</label>
        <input id="confirmPassword" type="password" formControlName="confirmPassword"
          [placeholder]="'confirmPasswordLabel' | translate">
        <div *ngIf="registerForm.errors?.['mismatch'] && registerForm.get('confirmPassword')?.touched" class="error-text">
          {{ 'passwordMismatch' | translate }}
        </div>
      </div>

      <button type="submit" [disabled]="isLoading">
        {{ (isLoading ? 'saving' : 'registerBtn') | translate }}
      </button>
    </form>

    <div class="footer-link">
      {{ 'hasAccount' | translate }} <a routerLink="/login">{{ 'loginLink' | translate }}</a>
    </div>
  </div>
</div>
