<div class="contrat-page" [attr.dir]="dir">

  <div class="contrat-header">
    <h2>⚙️ Paramètres de la société</h2>
    <button type="button" class="btn-save" (click)="save()" [disabled]="saving">
      {{ saving ? 'Enregistrement...' : 'Enregistrer' }}
    </button>
  </div>

  <div *ngIf="loading" class="state-msg">Chargement...</div>
  <div *ngIf="error && !loading" class="state-error">{{ error }}</div>

  <ng-container *ngIf="!loading && !error">

    <!-- Logo -->
    <div class="contrat-section">
      <div class="section-title">Logo de la société</div>
      <div class="logo-wrap">
        <img *ngIf="logoPreviewUrl" [src]="logoPreviewUrl" class="logo-preview" alt="logo" />
        <div *ngIf="!logoPreviewUrl" class="logo-placeholder">Aucun logo</div>
        <div class="logo-upload">
          <app-upload-btn label="Choisir un fichier" accept="image/*" (fileSelected)="onLogoChange($event)"></app-upload-btn>
          <span class="upload-hint">PNG ou JPG, max 2 Mo</span>
        </div>
      </div>
    </div>

    <!-- Infos société -->
    <div class="contrat-section">
      <div class="section-title">Informations de la société</div>
      <div class="grid-2">
        <div class="field">
          <label>Raison sociale</label>
          <input [(ngModel)]="raisonSociale" placeholder="Ex: AjrCar SARL" />
        </div>
        <div class="field">
          <label>Téléphones (séparés par une virgule)</label>
          <input [(ngModel)]="telephonesStr" placeholder="Ex: 0522 123 456, 0661 789 012" />
        </div>
        <div class="field" style="grid-column: 1 / -1">
          <label>Adresse</label>
          <input [(ngModel)]="adresse" placeholder="Ex: 25, Rue Mohammed V, Casablanca" />
        </div>
        <div class="field">
          <label>Email</label>
          <input [(ngModel)]="email" type="email" placeholder="contact@ajrcar.ma" />
        </div>
        <div class="field">
          <label>Site web</label>
          <input [(ngModel)]="website" type="url" placeholder="https://ajrcar.ma" />
        </div>
        <div class="field">
          <label>WhatsApp</label>
          <input [(ngModel)]="whatsapp" type="tel" placeholder="+212 6XX XXX XXX" />
        </div>
      </div>
    </div>

    <!-- Identifiants fiscaux -->
    <div class="contrat-section">
      <div class="section-title">Identifiants fiscaux</div>
      <div class="grid-2">
        <div class="field">
          <label>RC (Registre du Commerce)</label>
          <input [(ngModel)]="rc" placeholder="Ex: 12345" />
        </div>
        <div class="field">
          <label>ICE</label>
          <input [(ngModel)]="ice" placeholder="Ex: 000123456000012" />
        </div>
        <div class="field">
          <label>IF (Identifiant Fiscal)</label>
          <input [(ngModel)]="ifFiscal" placeholder="Ex: 12345678" />
        </div>
        <div class="field">
          <label>CNSS</label>
          <input [(ngModel)]="cnss" placeholder="Ex: 1234567" />
        </div>
      </div>
    </div>

    <!-- Site web public -->
    <div class="contrat-section">
      <div class="section-title">Site web public (ajrcar.com)</div>

      <div class="field" style="margin-bottom: 1rem">
        <label>Message promotionnel du bandeau (optionnel — vide = masqué)</label>
        <div class="grid-2">
          <input [(ngModel)]="promoMessageFr" placeholder="Français" />
          <input [(ngModel)]="promoMessageEn" placeholder="English" />
          <input [(ngModel)]="promoMessageAr" placeholder="العربية" dir="rtl" />
        </div>
      </div>

      <div class="field" style="margin-bottom: 1rem">
        <label>Horaires affichés sur le site</label>
        <div class="grid-2">
          <input [(ngModel)]="horairesFr" placeholder="Français" />
          <input [(ngModel)]="horairesEn" placeholder="English" />
          <input [(ngModel)]="horairesAr" placeholder="العربية" dir="rtl" />
        </div>
      </div>

      <div class="grid-2">
        <div class="field">
          <label>Facebook (vide = icône masquée)</label>
          <input [(ngModel)]="facebookUrl" type="url" placeholder="https://facebook.com/..." />
        </div>
        <div class="field">
          <label>Instagram (vide = icône masquée)</label>
          <input [(ngModel)]="instagramUrl" type="url" placeholder="https://instagram.com/..." />
        </div>
        <div class="field">
          <label>TikTok (vide = icône masquée)</label>
          <input [(ngModel)]="tiktokUrl" type="url" placeholder="https://tiktok.com/@..." />
        </div>
        <div class="field">
          <label>Nombre de clients affiché</label>
          <input [(ngModel)]="nombreClients" type="number" placeholder="Ex: 12000" />
        </div>
        <div class="field">
          <label>Nombre de villes desservies affiché</label>
          <input [(ngModel)]="villesDesservies" type="number" placeholder="Ex: 8" />
        </div>
      </div>
    </div>

    <div class="bottom-actions">
      <button type="button" class="btn-save" (click)="save()" [disabled]="saving">
        {{ saving ? 'Enregistrement...' : 'Enregistrer' }}
      </button>
    </div>

  </ng-container>
</div>
