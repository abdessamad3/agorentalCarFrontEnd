<div class="app-layout" [attr.dir]="dir" [class.has-sidebar]="showShell" [class.sidebar-collapsed]="sidebarCollapsed">

  <ng-container *ngIf="showShell">
    <app-sidebar
      [isSidebarOpen]="isSidebarOpen"
      (closeSidebar)="closeSidebar()"
      (collapsedChange)="onSidebarCollapsedChange($event)"
    ></app-sidebar>
  </ng-container>

  <div class="main-content">

    <app-top-header
      *ngIf="showShell"
      (menuToggle)="toggleSidebar()"
    ></app-top-header>

    <app-breadcrumb *ngIf="showShell"></app-breadcrumb>

    <div class="page-content">
      <div *ngIf="routerLoading" class="global-loading-overlay">
        <div class="global-spinner"></div>
      </div>
      <router-outlet></router-outlet>
    </div>
  </div>

  <div
    *ngIf="showShell && isSidebarOpen"
    class="sidebar-overlay"
    (click)="closeSidebar()"
  ></div>

  <app-toast></app-toast>
</div>
