<div class="modal-overlay" (click)="closed.emit()">
  <div class="modal delivery-modal" (click)="$event.stopPropagation()">

    <div class="modal-header">
      <h2>{{ t('vehicleDeliveryTitle') }}</h2>
      <span class="modal-subtitle" *ngIf="reservation">
        {{ reservation.voiture?.marque }} {{ reservation.voiture?.modele }} —
        {{ reservation.client?.nom }}
      </span>
      <button class="modal-close" (click)="closed.emit()">&times;</button>
    </div>

    <div class="modal-body">

      <!-- Mileage -->
      <div class="form-section">
        <label class="field-label">{{ t('mileageOut') }} <span class="required">*</span></label>
        <input type="number" [(ngModel)]="mileageOut" min="0" class="field-input" placeholder="ex: 45000" />
      </div>

      <!-- Fuel -->
      <div class="form-section">
        <label class="field-label">{{ t('fuelAtDeparture') }}</label>
        <app-fuel-gauge [value]="fuelLevel" (valueChange)="onFuelChange($event)"></app-fuel-gauge>
      </div>

      <!-- Accessories -->
      <div class="form-section">
        <label class="field-label">{{ t('accessories') }}</label>
        <div class="accessories-grid">
          <label class="check-item"><input type="checkbox" [(ngModel)]="hasExtincteur" /> {{ t('extinguisher') }}</label>
          <label class="check-item"><input type="checkbox" [(ngModel)]="hasCric" /> {{ t('jack') }}</label>
          <label class="check-item"><input type="checkbox" [(ngModel)]="hasGilet" /> {{ t('safetyVest') }}</label>
          <label class="check-item"><input type="checkbox" [(ngModel)]="hasRoueSecours" /> {{ t('spareWheel') }}</label>
          <label class="check-item"><input type="checkbox" [(ngModel)]="hasPlaqueDepannage" /> {{ t('breakdownPlate') }}</label>
          <label class="check-item"><input type="checkbox" [(ngModel)]="hasLavage" /> {{ t('carWash') }}</label>
          <label class="check-item"><input type="checkbox" [(ngModel)]="hasSiegeBebe" /> {{ t('babySeat') }}</label>
        </div>
      </div>

      <!-- Notes -->
      <div class="form-section">
        <label class="field-label">{{ t('equipmentNotes') }}</label>
        <textarea [(ngModel)]="equipementNotes" class="field-textarea" rows="2" [placeholder]="t('equipmentNotesPlaceholder')"></textarea>
      </div>
      <div class="form-section">
        <label class="field-label">{{ t('deliveryNotes') }}</label>
        <textarea [(ngModel)]="deliveryNotes" class="field-textarea" rows="2" [placeholder]="t('deliveryNotesPlaceholder')"></textarea>
      </div>

      <!-- Signatures -->
      <div class="signatures-row">
        <div class="sig-block">
          <app-signature-pad [label]="t('signatureClient')" (signatureChange)="onSignatureClient($event)"></app-signature-pad>
        </div>
        <div class="sig-block">
          <app-signature-pad [label]="t('signatureAgent')" (signatureChange)="onSignatureAgent($event)"></app-signature-pad>
        </div>
      </div>

    </div>

    <div class="modal-footer">
      <app-btn variant="secondary" (click)="closed.emit()">{{ t('cancel') }}</app-btn>
      <app-btn variant="primary" (click)="submit()" [disabled]="!isValid || isSubmitting">
        {{ isSubmitting ? t('handingOverKeys') : t('confirmDelivery') }}
      </app-btn>
    </div>

  </div>
</div>
